bio: |
  I am an incoming Ph.D. student in Computer Science in the double-degree programme between Université Paris-Saclay and the University of Exeter, starting in October 2026. I will be supervised by Dr [Céline Clavel](https://clavelcel.wixsite.com/monsite) and Professor [Nicolas Sabouret](https://perso.limsi.fr/sabouret/) at Université Paris-Saclay, and Dr [Xingchen Zhang](https://xingchenzhang.github.io/) and Professor [Andrew Howes](https://experts.exeter.ac.uk/41016-andrew-howes) at the University of Exeter. My research interests lie in embodied AI, multimodal perception, and computational cognitive modeling.

  I currently work as an AI Engineer at China National Petroleum Corporation. I received my MSc in Applied Machine Learning with Distinction from Imperial College London, where I conducted research at [MatchLab](https://www.imperial.ac.uk/matchlab/) under Professor [Krystian Mikolajczyk](https://profiles.imperial.ac.uk/k.mikolajczyk). My work on fisheye UAV obstacle detection led to AirEyeSeg, which received the [Best Student Paper Award at ICPRAM 2024](https://icpram.scitevents.org/PreviousAwards.aspx#2024). I earned my BEng in Mechatronics Engineering from Tianjin University of Technology, supervised by Professor [Mian Zhang](https://me.tjut.edu.cn/info/1060/1786.htm).
