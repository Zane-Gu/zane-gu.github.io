bio: |
  I am an incoming PhD student in Computer Science on the double-degree programme jointly offered by the University of Exeter and Université Paris-Saclay, beginning in October 2026 with full funding through an ADI studentship. I will be jointly supervised by Dr [Xingchen Zhang](https://xingchenzhang.github.io/) and Professor [Andrew Howes](https://experts.exeter.ac.uk/41016-andrew-howes) at the University of Exeter, and Dr [Céline Clavel](https://clavelcel.wixsite.com/monsite) and Professor [Nicolas Sabouret](https://perso.limsi.fr/sabouret/) at Université Paris-Saclay. My research interests include embodied AI, multimodal perception, and computational cognitive modelling.

  I currently work as an AI Engineer at China National Petroleum Corporation. I received my MSc in Applied Machine Learning with Distinction from Imperial College London, where I conducted research at [MatchLab](https://www.imperial.ac.uk/matchlab/) under the supervision of Professor [Krystian Mikolajczyk](https://profiles.imperial.ac.uk/k.mikolajczyk). My research on obstacle detection for fisheye-camera-equipped UAVs resulted in AirEyeSeg, which received the [Best Student Paper Award at ICPRAM 2024](https://icpram.scitevents.org/PreviousAwards.aspx#2024). I earned my BEng in Mechatronic Engineering from Tianjin University of Technology, where I was fortunate to be supervised by Professor [Mian Zhang](https://me.tjut.edu.cn/info/1060/1786.htm).

